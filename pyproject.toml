[project]
name = "bev-vqa"
version = "0.1.0"
description = "Modular BEV → VLM → VQA pipeline for autonomous driving scene understanding"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    # LLM & LoRA
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    # Config & logging
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.16.0",
    # Data & eval
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.3.0",
    # NLG metrics (DriveLM eval)
    "nltk>=3.8.0",
    "rouge-score>=0.1.2",
    "pycocoevalcap>=1.2",
    # Viz
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bev_vqa"]
