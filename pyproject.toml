[project]
name = "bev-vqa"
version = "0.1.0"
description = "Modular BEV → VLM → VQA pipeline for autonomous driving scene understanding"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "torch>=2.1.0",

    # LLM & LoRA
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    # Data & eval
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    # NLG metrics (DriveLM eval)
    "nltk>=3.8.0",
    "pycocoevalcap>=1.2",
    # Viz
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bev_vqa"]
